name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax checks
        shell: pwsh
        run: |
          node --check content.js
          node --check background.js
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'updater/Update-RoTool.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Tests
        shell: pwsh
        run: |
          Get-ChildItem tests -Filter '*.test.cjs' | Sort-Object Name | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node tests/run-background-fixture.cjs
      - name: Build release packages
        shell: pwsh
        run: ./tools/build-release.ps1 -OutputDirectory dist
      - uses: actions/upload-artifact@v4
        with:
          name: rotool-packages
          path: dist/
          if-no-files-found: error
          retention-days: 14
