        hooks.setMutualFriendsPageRouteUrlForTests(
          "https://www.roblox.com/users/123/friends#!/friends"
        );
        hooks.mountMutualFriendsPage();
        if (
          document.querySelector("[data-rsl-mutual-friends-tab]") ||
          getComputedStyle(document.querySelector(".ropro-mutual-tab")).display === "none"
        ) {
          throw new Error("Own Friends pages must omit Mutuals and restore competing UI");
        }
        ownFriendsViewerMeta.remove();
        hooks.setMutualFriendsPageRouteUrlForTests(null);
        hooks.setMutualFriendsPageMessageSenderForTests(null);

        if (
          document.documentElement.getAttribute("class") !== originalHtmlClass ||
          document.body.getAttribute("class") !== originalBodyClass
        ) {
          throw new Error("RoPro theme classes were modified");
        }
        for (const [id, src, style] of frameState) {
          const frame = document.getElementById(id);
          if (
            !frame?.isConnected ||
            frame.getAttribute("src") !== src ||
            frame.getAttribute("style") !== style
          ) {
            throw new Error(`${id} was modified`);
          }
        }
        document.body.dataset.testResult = "pass";
        document.body.dataset.testMessage = "Enhanced Profile browser fixture passed";
        document.title = "PASS: RoTool Enhanced Profile browser fixture";
      })().catch((error) => {
        document.body.dataset.testResult = "fail";
        document.body.dataset.testMessage = error?.message || String(error);
        document.title = `FAIL: ${document.body.dataset.testMessage}`;
      });
    </script>
  </body>
</html>
