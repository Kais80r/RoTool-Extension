<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RoTool feature settings fixture</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
      :root {
        color-scheme: dark;
        --color-surface-100: #191a1f;
        --color-surface-200: #24262c;
        --color-surface-300: #4b4d57;
        --color-content-emphasis: #f7f7f8;
        --color-content-default: #b7bac3;
        --color-stroke-default: rgb(255 255 255 / 14%);
        --color-action-emphasis-background: #335fff;
        --color-action-emphasis-foreground: #fff;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: #f7f7f8;
        background: #0f1014;
        font: 16px/1.4 Arial, sans-serif;
      }

      #header {
        height: 40px;
        background: #191a1f;
      }

      #right-navigation-header {
        display: flex;
        height: 40px;
        margin: 0;
        padding: 0 16px;
        justify-content: flex-end;
        list-style: none;
      }

      #navbar-settings {
        display: flex;
        width: 40px;
        align-items: center;
        justify-content: center;
      }

      #navbar-settings > .btn-navigation-nav-settings-md {
        display: flex;
        width: 36px;
        height: 36px;
        align-items: center;
        justify-content: center;
        color: white;
        background: transparent;
        border: 0;
      }

      #nav-settings {
        display: block;
        width: 24px;
        height: 24px;
      }
    </style>
  </head>
  <body data-test-result="pending">
    <header id="header" class="navbar-fixed-top rbx-header" role="navigation">
      <ul id="right-navigation-header">
        <li id="navbar-settings" class="navbar-icon-item">
          <button type="button" aria-label="Settings">⚙</button>
        </li>
      </ul>
    </header>
    <script>
      // Reproduce Roblox's live settings-button structure supplied from DevTools.
      document.querySelector("#navbar-settings > button").outerHTML =
        '<button type="button" class="btn-navigation-nav-settings-md" aria-label="Settings" aria-haspopup="true" aria-describedby="settings-popover">' +
          '<span id="settings-icon" class="nav-settings-icon rbx-menu-item" aria-hidden="true">' +
            '<span class="icon-nav-settings roblox-popover-close" id="nav-settings"></span>' +
          '</span>' +
        '</button>';
    </script>
    <script>
      globalThis.__rslFixtureStorage = {};
      globalThis.__rslDeferredStorageCallback = null;
      globalThis.__rslDeferStorageCallback = false;
      globalThis.__rslFailNextStorageWrite = false;
      globalThis.chrome = {
        runtime: {
          id: "fixture-extension",
          lastError: null,
          getURL(relativePath = "") {
            return new URL(`../${relativePath}`, location.href).href;
          }
        },
        storage: {
          local: {
            set(values, callback) {
              if (globalThis.__rslFailNextStorageWrite) {
                globalThis.__rslFailNextStorageWrite = false;
                globalThis.chrome.runtime.lastError = { message: "Fixture write failed" };
                callback?.();
                globalThis.chrome.runtime.lastError = null;
                return;
              }
              Object.assign(globalThis.__rslFixtureStorage, values);
              if (globalThis.__rslDeferStorageCallback) {
                globalThis.__rslDeferredStorageCallback = callback || null;
                return;
              }
              callback?.();
            }
          }
        }
      };
      globalThis.__rslContentTestHooks = { skipInitialize: true };
    </script>
    <script src="../content.js"></script>
    <script>
      (async () => {
        const hooks = globalThis.__rslContentTestHooks;
        const nextFrame = () => new Promise((resolve) => {
          let settled = false;
          const finish = () => {
            if (settled) return;
            settled = true;
            resolve();
          };
          requestAnimationFrame(finish);
          setTimeout(finish, 50);
        });
        try {
          hooks.setFeatureSettingsForTests({
            version: 1,
            flags: {
              sidebarShortcuts: true,
              sidebarCustomShortcuts: true,
              sidebarHome: true,
              sidebarProfile: true,
              sidebarRobloxPlus: true,
              sidebarMessages: true,
              sidebarFriends: true,
              sidebarAvatar: true,
              sidebarInventory: true,
              sidebarTrade: true,
              sidebarCommunities: true,
              sidebarBlog: true,
              sidebarGiftCards: true,
              sidebarOfficialStore: true,
              quickSettings: true,
              quickSettingsOnlineStatus: true,
              quickSettingsCurrentExperience: true,
              quickSettingsInventory: true,
              bestFriends: true,
              friendFilters: true,
              quickPlay: true,
              quickPlayActionPlay: true,
              quickPlayActionPrivate: true,
              quickPlayActionRandom: true,
              gameCcu: true,
              gameCcuHoverGraph: true,
              recoverySnapshots: true,
              recoverySnapshotMenu: true,
              recoverySnapshotArchive: false,
              // Intentionally omit recoverySnapshotReminder: its normalized default is on.
              copyRobloxIds: true
            }
          });
          hooks.setAccountRecoveryArchivePreferencesForTests({
            version: 2,
            frequency: "daily",
            retention: 5,
            sections: [
              "usernameHistory",
              "twoStepVerification",
              "purchases",
              "currencyPurchases",
              "tradeHistory",
              "recentlyPlayed",
              "createdExperiences",
              "violations"
            ],
            revision: 1
          });
          hooks.mountFeatureSettingsButton();
          const roToolButton = document.querySelector("#rsl-navbar-settings button");
          if (!roToolButton || roToolButton.parentElement.previousElementSibling?.id !== "navbar-settings") {
            throw new Error("RoTool Settings was not mounted directly beside Roblox Settings");
          }
          const roToolButtonRect = roToolButton.getBoundingClientRect();
          const roToolLogoRect = roToolButton.querySelector("svg").getBoundingClientRect();
          if (
            roToolButtonRect.width !== 36 ||
            roToolButtonRect.height !== 36 ||
            roToolLogoRect.width !== 24 ||
            roToolLogoRect.height !== 24
          ) {
            throw new Error("RoTool Settings did not mirror the native control geometry");
          }
          roToolButton.click();
          const dialog = document.getElementById("rsl-feature-settings-dialog");
          const switches = Array.from(
            dialog?.querySelectorAll("[data-rsl-feature-key][role='switch']") || []
          );
          const serverHistorySwitch = dialog?.querySelector(
            '[data-rsl-feature-key="serverHistory"]'
          );
          if (
            !dialog?.open ||
            switches.length !== hooks.featureSettingDefinitions.length ||
            serverHistorySwitch?.checked !== false ||
            switches.some((input) => {
              const key = input.getAttribute("data-rsl-feature-key");
              return input.checked !== (hooks.defaultFeatureSettings[key] !== false);
            })
          ) {
            throw new Error(
              "Feature settings dialog did not preserve the complete default switch state"
            );
          }
          dialog.close();
          let rejectedSettingsResponse = null;
          hooks.handleShowFeatureSettingsMessage(
            { type: "rsl:show-feature-settings", unexpected: true },
            {
              id: chrome.runtime.id
            },
            (response) => {
              rejectedSettingsResponse = response;
            }
          );
          if (dialog.open || rejectedSettingsResponse !== null) {
            throw new Error("Feature settings accepted a runtime message with extra fields");
          }
          let acceptedSettingsResponse = null;
          hooks.handleShowFeatureSettingsMessage(
            { type: "rsl:show-feature-settings" },
            {
              id: chrome.runtime.id
            },
            (response) => {
              acceptedSettingsResponse = response;
            }
          );
          if (
            !dialog.open ||
            JSON.stringify(acceptedSettingsResponse) !==
              JSON.stringify({
                ok: true,
                type: "rsl:show-feature-settings"
              })
          ) {
            throw new Error("Trusted toolbar request did not open RoTool Settings");
          }
          const advancedButtons = Array.from(
            dialog.querySelectorAll("[data-rsl-feature-disclosure]")
          );
          if (
            advancedButtons.length !== 6 ||
            advancedButtons.some((button) => {
              const panel = document.getElementById(button.getAttribute("aria-controls"));
              return button.getAttribute("aria-expanded") !== "false" || !panel?.hidden;
            })
          ) {
            throw new Error("Advanced settings disclosures were not collapsed and linked to panels");
          }
          const disclosureNames = advancedButtons.map((button) =>
            button.getAttribute("aria-label")
          );
          if (
              !disclosureNames.includes("Advanced settings for Sidebar Customization") ||
              !disclosureNames.includes("Advanced settings for Quick Settings") ||
              !disclosureNames.includes("Advanced settings for RoTool Update Popups") ||
              !disclosureNames.includes("Advanced settings for Quick Play & Servers") ||
              !disclosureNames.includes("Advanced settings for Enhanced Profiles") ||
              !disclosureNames.includes("Advanced settings for Recovery Snapshots") ||
            new Set(disclosureNames).size !== disclosureNames.length
          ) {
            throw new Error("Advanced disclosures do not have distinct contextual accessible names");
          }
          const quickSettingsDisclosure = dialog.querySelector(
            '[data-rsl-feature-disclosure="quickSettings"]'
          );
          const quickSettingsAdvanced = document.getElementById(
            quickSettingsDisclosure?.getAttribute("aria-controls") || ""
          );
          quickSettingsDisclosure?.click();
          if (
            quickSettingsDisclosure?.getAttribute("aria-expanded") !== "true" ||
            quickSettingsAdvanced?.hidden ||
            quickSettingsAdvanced?.getAttribute("role") !== "group" ||
            quickSettingsAdvanced?.getAttribute("aria-label") !==
              "Quick Settings advanced settings"
          ) {
            throw new Error("Quick Settings Advanced is not an accessible disclosure");
          }
          quickSettingsDisclosure.click();
          const headerLogo = roToolButton.querySelector(".rsl-navbar-settings-logo");
          const dialogLogo = dialog.querySelector(".rsl-feature-settings__logo");
          const buttonRect = roToolButton.getBoundingClientRect();
          const headerLogoRect = headerLogo.getBoundingClientRect();
          const dialogLogoRect = dialogLogo.getBoundingClientRect();
          const headerCenterDelta = [
            headerLogoRect.left + headerLogoRect.width / 2 -
              (buttonRect.left + buttonRect.width / 2),
            headerLogoRect.top + headerLogoRect.height / 2 -
              (buttonRect.top + buttonRect.height / 2)
          ];
          if (headerCenterDelta.some((value) => Math.abs(value) > 0.1)) {
            throw new Error("The header SVG box is not centered inside its button");
          }
          document.body.dataset.headerLogoRect = JSON.stringify({
            left: headerLogoRect.left,
            top: headerLogoRect.top,
            width: headerLogoRect.width,
            height: headerLogoRect.height
          });
          document.body.dataset.dialogLogoRect = JSON.stringify({
            left: dialogLogoRect.left,
            top: dialogLogoRect.top,
            width: dialogLogoRect.width,
            height: dialogLogoRect.height
          });

          const quickPlaySwitch = dialog.querySelector("[data-rsl-feature-key='quickPlay']");
          const gameCcuSwitch = dialog.querySelector("[data-rsl-feature-key='gameCcu']");
          globalThis.__rslDeferStorageCallback = true;
          const pendingQuickPlaySave = hooks.saveFeatureSettingsForTests({ quickPlay: false });
          if (
            quickPlaySwitch.checked ||
            !dialog.querySelector("[data-rsl-feature-key='quickPlayActionPlay']")?.disabled ||
            !dialog.querySelector("[data-rsl-feature-key='quickPlayActionPrivate']")?.disabled ||
            !dialog.querySelector("[data-rsl-feature-key='quickPlayActionRandom']")?.disabled
          ) {
            throw new Error("The settings UI waited for storage instead of updating optimistically");
          }
          await Promise.resolve();
          await Promise.resolve();
          if (!globalThis.__rslDeferredStorageCallback) {
            throw new Error("The deferred feature setting write did not start");
          }
          globalThis.__rslDeferStorageCallback = false;
          globalThis.__rslDeferredStorageCallback?.();
          globalThis.__rslDeferredStorageCallback = null;
          await pendingQuickPlaySave;
          const saved = globalThis.__rslFixtureStorage.rslFeatureSettingsV1;
          if (
            saved?.version !== 1 ||
            saved.flags?.quickPlay !== false ||
            quickPlaySwitch.checked ||
            !gameCcuSwitch?.checked ||
            !dialog.querySelector("[data-rsl-feature-key='quickPlayActionPlay']")?.disabled ||
            !dialog.querySelector("[data-rsl-feature-key='quickPlayActionPrivate']")?.disabled ||
            !dialog.querySelector("[data-rsl-feature-key='quickPlayActionRandom']")?.disabled
          ) {
            throw new Error("The disabled Quick Play master did not preserve and disable its child controls");
          }
          await hooks.saveFeatureSettingsForTests({ quickPlay: true });
          if (
            !quickPlaySwitch.checked ||
            dialog.querySelector("[data-rsl-feature-key='quickPlayActionPlay']")?.disabled ||
            dialog.querySelector("[data-rsl-feature-key='quickPlayActionPrivate']")?.disabled ||
            dialog.querySelector("[data-rsl-feature-key='quickPlayActionRandom']")?.disabled
          ) {
            throw new Error("Feature settings did not re-enable a feature");
          }

          const quickSettingsSwitch = dialog.querySelector(
            "[data-rsl-feature-key='quickSettings']"
          );
          const quickSettingsOnlineStatusSwitch = dialog.querySelector(
            "[data-rsl-feature-key='quickSettingsOnlineStatus']"
          );
          const quickSettingsCurrentExperienceSwitch = dialog.querySelector(
            "[data-rsl-feature-key='quickSettingsCurrentExperience']"
          );
          const quickSettingsInventorySwitch = dialog.querySelector(
            "[data-rsl-feature-key='quickSettingsInventory']"
          );
          await hooks.saveFeatureSettingsForTests({
            quickSettingsCurrentExperience: false
          });
          await hooks.saveFeatureSettingsForTests({ quickSettings: false });
          if (
            quickSettingsSwitch.checked ||
            !quickSettingsOnlineStatusSwitch.checked ||
            quickSettingsCurrentExperienceSwitch.checked ||
            !quickSettingsInventorySwitch.checked ||
            !quickSettingsOnlineStatusSwitch.disabled ||
            !quickSettingsCurrentExperienceSwitch.disabled ||
            !quickSettingsInventorySwitch.disabled
          ) {
            throw new Error(
              "The Quick Settings master did not preserve and disable its individual controls"
            );
          }
          const quickSettingsParentOffSaved =
            globalThis.__rslFixtureStorage.rslFeatureSettingsV1;
          if (
            quickSettingsParentOffSaved.flags?.quickSettings !== false ||
            quickSettingsParentOffSaved.flags?.quickSettingsOnlineStatus !== true ||
            quickSettingsParentOffSaved.flags?.quickSettingsCurrentExperience !== false ||
            quickSettingsParentOffSaved.flags?.quickSettingsInventory !== true
          ) {
            throw new Error("Quick Settings parent-off persistence erased a child choice");
          }
          await hooks.saveFeatureSettingsForTests({ quickSettings: true });
          if (
            !quickSettingsSwitch.checked ||
            !quickSettingsOnlineStatusSwitch.checked ||
            quickSettingsCurrentExperienceSwitch.checked ||
            !quickSettingsInventorySwitch.checked ||
            quickSettingsOnlineStatusSwitch.disabled ||
            quickSettingsCurrentExperienceSwitch.disabled ||
            quickSettingsInventorySwitch.disabled
          ) {
            throw new Error("Re-enabling Quick Settings did not restore its child choices");
          }

          globalThis.__rslFailNextStorageWrite = true;
          await hooks.saveFeatureSettingsForTests({ quickSettingsOnlineStatus: false });
          if (!quickSettingsOnlineStatusSwitch.checked) {
            throw new Error(
              "A failed Quick Settings child write did not roll its optimistic state back"
            );
          }

          globalThis.__rslDeferStorageCallback = true;
          const rapidQuickSettingsHide = hooks.saveFeatureSettingsForTests({
            quickSettingsInventory: false
          });
          const rapidQuickSettingsShow = hooks.saveFeatureSettingsForTests({
            quickSettingsInventory: true
          });
          if (!quickSettingsInventorySwitch.checked) {
            throw new Error("Rapid Quick Settings child toggles did not paint the latest choice");
          }
          await Promise.resolve();
          await Promise.resolve();
          const firstQuickSettingsWrite = globalThis.__rslDeferredStorageCallback;
          globalThis.__rslDeferredStorageCallback = null;
          if (!firstQuickSettingsWrite) {
            throw new Error("The first rapid Quick Settings child write did not start");
          }
          firstQuickSettingsWrite();
          for (
            let index = 0;
            index < 6 && !globalThis.__rslDeferredStorageCallback;
            index += 1
          ) {
            await Promise.resolve();
          }
          const secondQuickSettingsWrite = globalThis.__rslDeferredStorageCallback;
          globalThis.__rslDeferredStorageCallback = null;
          if (!secondQuickSettingsWrite) {
            throw new Error("Rapid Quick Settings child writes were not serialized");
          }
          globalThis.__rslDeferStorageCallback = false;
          secondQuickSettingsWrite();
          await Promise.all([rapidQuickSettingsHide, rapidQuickSettingsShow]);
          if (
            !quickSettingsInventorySwitch.checked ||
            globalThis.__rslFixtureStorage.rslFeatureSettingsV1?.flags
              ?.quickSettingsInventory !== true
          ) {
            throw new Error("Rapid Quick Settings child toggles did not persist the latest choice");
          }

          const homeSwitch = dialog.querySelector("[data-rsl-feature-key='sidebarHome']");
          globalThis.__rslFailNextStorageWrite = true;
          await hooks.saveFeatureSettingsForTests({ sidebarHome: false });
          if (!homeSwitch?.checked) {
            throw new Error("A failed settings write did not honestly roll the optimistic switch back");
          }

          globalThis.__rslDeferStorageCallback = true;
          const rapidHide = hooks.saveFeatureSettingsForTests({ sidebarHome: false });
          const rapidShow = hooks.saveFeatureSettingsForTests({ sidebarHome: true });
          if (!homeSwitch.checked) {
            throw new Error("Rapid toggles did not immediately show the latest choice");
          }
          await Promise.resolve();
          await Promise.resolve();
          const firstRapidWrite = globalThis.__rslDeferredStorageCallback;
          globalThis.__rslDeferredStorageCallback = null;
          if (!firstRapidWrite) {
            throw new Error("The first rapid settings write did not start");
          }
          firstRapidWrite();
          for (let index = 0; index < 6 && !globalThis.__rslDeferredStorageCallback; index += 1) {
            await Promise.resolve();
          }
          const secondRapidWrite = globalThis.__rslDeferredStorageCallback;
          globalThis.__rslDeferredStorageCallback = null;
          if (!secondRapidWrite) {
            throw new Error("Rapid settings writes were not serialized");
          }
          globalThis.__rslDeferStorageCallback = false;
          secondRapidWrite();
          await Promise.all([rapidHide, rapidShow]);
          if (
            !homeSwitch.checked ||
            globalThis.__rslFixtureStorage.rslFeatureSettingsV1?.flags?.sidebarHome !== true
          ) {
            throw new Error("Rapid toggles did not persist the latest choice");
          }

          await hooks.saveFeatureSettingsForTests({ sidebarHome: false });
          await hooks.saveFeatureSettingsForTests({ sidebarShortcuts: false });
          if (homeSwitch.checked || !homeSwitch.disabled) {
            throw new Error("The Sidebar parent did not preserve and disable its individual choices");
          }
          await hooks.saveFeatureSettingsForTests({ sidebarShortcuts: true });
          if (homeSwitch.checked || homeSwitch.disabled) {
            throw new Error("Re-enabling Sidebar did not restore its preserved individual choices");
          }

          const graphSwitch = dialog.querySelector("[data-rsl-feature-key='gameCcuHoverGraph']");
          await hooks.saveFeatureSettingsForTests({ gameCcu: false });
          if (!graphSwitch.checked || graphSwitch.disabled || gameCcuSwitch.checked) {
            throw new Error("Player Counts incorrectly disabled the independent Hover Graph");
          }
          await hooks.saveFeatureSettingsForTests({ gameCcuHoverGraph: false });
          if (graphSwitch.checked || graphSwitch.disabled) {
            throw new Error("Hover Graph could not be switched independently of Player Counts");
          }
          await hooks.saveFeatureSettingsForTests({ gameCcu: true });
          if (graphSwitch.checked || graphSwitch.disabled || !gameCcuSwitch.checked) {
            throw new Error("Re-enabling Player Counts changed the independent Hover Graph choice");
          }

          const recoverySwitch = dialog.querySelector(
            "[data-rsl-feature-key='recoverySnapshots']"
          );
          const recoveryDisclosure = dialog.querySelector(
            '[data-rsl-feature-disclosure="recoverySnapshots"]'
          );
          const recoveryAdvanced = document.getElementById(
            recoveryDisclosure?.getAttribute("aria-controls") || ""
          );
          const recoveryOpen = recoveryAdvanced?.querySelector(
            "[data-rsl-account-recovery-settings-action]"
          );
          const recoveryViewAll = recoveryAdvanced?.querySelector(
            "[data-rsl-account-recovery-archive-settings-action]"
          );
          const automaticRecoverySwitch = recoveryAdvanced?.querySelector(
            "[data-rsl-feature-key='recoverySnapshotArchive']"
          );
          const recoverySettingsMenuSwitch = recoveryAdvanced?.querySelector(
            "[data-rsl-feature-key='recoverySnapshotMenu']"
          );
          const automaticReminderSwitch = recoveryAdvanced?.querySelector(
            "[data-rsl-feature-key='recoverySnapshotReminder']"
          );
          const automaticReminderRow = automaticReminderSwitch?.closest(
            ".rsl-feature-settings__row"
          );
          const automaticReminderCopy = automaticReminderRow?.querySelector(
            ".rsl-feature-settings__copy"
          );
          const recoveryFrequency = recoveryAdvanced?.querySelector(
            "[data-rsl-account-recovery-archive-preference='frequency']"
          );
          const recoveryRetention = recoveryAdvanced?.querySelector(
            "[data-rsl-account-recovery-archive-preference='retention']"
          );
          const recoveryRecentlyPlayed = recoveryAdvanced?.querySelector(
            "[data-rsl-account-recovery-archive-preference='recentlyPlayed']"
          );
          const recoveryTradeHistory = recoveryAdvanced?.querySelector(
            "[data-rsl-account-recovery-archive-preference='tradeHistory']"
          );
          const recoverySectionSwitches = recoveryAdvanced?.querySelectorAll(
            ".rsl-feature-settings__row--recovery-section [role='switch']"
          );
          const recoveryCaptureHeading = Array.from(
            recoveryAdvanced?.querySelectorAll(
              ".rsl-feature-settings__children-heading--recovery"
            ) || []
          ).find((heading) =>
            heading.querySelector("span")?.textContent ===
              "Information to capture automatically"
          );
          const recoveryItem = recoverySwitch?.closest(
            ".rsl-feature-settings__item"
          );
          if (
            recoveryItem?.querySelector(
              ":scope > .rsl-feature-settings__row .rsl-feature-settings__copy strong"
            )?.textContent !== "Recovery Snapshots" ||
            !recoveryOpen ||
            recoveryOpen.textContent !== "Open" ||
            !recoveryViewAll ||
            recoveryViewAll.textContent !== "Open" ||
            !recoverySettingsMenuSwitch ||
            recoverySettingsMenuSwitch.checked !== true ||
            !automaticRecoverySwitch ||
            recoveryFrequency?.value !== "daily" ||
            recoveryRetention?.value !== "5" ||
            recoveryTradeHistory?.checked !== true ||
            recoveryRecentlyPlayed?.checked !== true ||
            recoverySectionSwitches?.length !== 8 ||
            Array.from(recoverySectionSwitches || []).some(
              (sectionSwitch) => sectionSwitch.checked !== true
            ) ||
            recoveryCaptureHeading?.querySelector("small")?.textContent !==
              "8 of 8 selected" ||
            !automaticReminderSwitch ||
            automaticReminderSwitch.checked !== true ||
            automaticReminderCopy?.querySelector("strong")?.textContent !==
              "Automatic snapshot reminders" ||
            automaticReminderCopy?.querySelector("span")?.textContent !==
              "Show a Home reminder every 3 hours while Automatic snapshots are off." ||
            automaticRecoverySwitch.closest(".rsl-feature-settings__row")
              ?.classList.contains("rsl-feature-settings__row--child") !== true ||
            recoverySettingsMenuSwitch.closest(".rsl-feature-settings__row")
              ?.classList.contains("rsl-feature-settings__row--child") !== true ||
            automaticReminderRow?.classList.contains(
              "rsl-feature-settings__row--child"
            ) !== true
          ) {
            throw new Error(
              "Recovery Snapshots was not consolidated into one Advanced settings hierarchy"
            );
          }
          const settingsViewport = dialog.querySelector(
            ".rsl-feature-settings-dialog__body"
          );
          recoverySwitch
            ?.closest(".rsl-feature-settings__row")
            ?.scrollIntoView({ block: "center" });
          recoverySwitch?.focus({ preventScroll: true });
          await nextFrame();
          const recoveryScrollBefore = settingsViewport?.scrollTop ?? 0;
          const recoveryScrollMaximum = settingsViewport
            ? settingsViewport.scrollHeight - settingsViewport.clientHeight
            : 0;
          const pageScrollBefore = window.scrollY;
          if (
            !settingsViewport ||
            recoveryScrollBefore <= 1 ||
            recoveryScrollBefore >= recoveryScrollMaximum - 1
          ) {
            throw new Error(
              "Recovery scroll regression test could not establish an interior Settings position"
            );
          }
          await hooks.saveFeatureSettingsForTests({
            recoverySnapshotMenu: false
          });
          await nextFrame();
          if (
            Math.abs(settingsViewport.scrollTop - recoveryScrollBefore) > 1 ||
            window.scrollY !== pageScrollBefore ||
            document.activeElement !== recoverySwitch
          ) {
            throw new Error(
              `Hiding the Recovery shortcut moved Settings: ${recoveryScrollBefore} -> ${settingsViewport.scrollTop}`
            );
          }
          if (
            !recoverySwitch?.checked ||
            recoverySettingsMenuSwitch?.checked ||
            recoverySettingsMenuSwitch?.disabled ||
            recoveryOpen?.disabled ||
            recoveryViewAll?.disabled ||
            automaticRecoverySwitch?.disabled ||
            automaticReminderSwitch?.disabled ||
            recoveryAdvanced?.hasAttribute("data-rsl-feature-parent-disabled")
          ) {
            throw new Error(
              "The Advanced Roblox Settings-menu switch changed another Recovery control"
            );
          }
          await hooks.saveFeatureSettingsForTests({ recoverySnapshotArchive: false });
          if (
            automaticRecoverySwitch.checked ||
            !recoverySwitch.checked ||
            recoverySettingsMenuSwitch.checked ||
            !automaticReminderSwitch.checked ||
            automaticReminderSwitch.disabled ||
            recoveryOpen.disabled ||
            recoveryViewAll.disabled ||
            !recoveryFrequency.disabled ||
            recoveryRetention.disabled ||
            recoveryRecentlyPlayed.disabled
          ) {
            throw new Error(
              "Automatic snapshots could not be changed independently of the Roblox Settings shortcut"
            );
          }
          automaticReminderRow.scrollIntoView({ block: "center" });
          automaticReminderSwitch.focus({ preventScroll: true });
          await nextFrame();
          const reminderScrollBefore = settingsViewport.scrollTop;
          await hooks.saveFeatureSettingsForTests({
            recoverySnapshotReminder: false
          });
          await nextFrame();
          if (
            automaticReminderSwitch.checked ||
            automaticReminderSwitch.disabled ||
            automaticRecoverySwitch.checked ||
            !recoverySwitch.checked ||
            recoverySettingsMenuSwitch.checked ||
            Math.abs(settingsViewport.scrollTop - reminderScrollBefore) > 1
          ) {
            throw new Error(
              "Automatic snapshot reminders could not be disabled independently without moving Settings"
            );
          }
          await hooks.saveFeatureSettingsForTests({
            recoverySnapshotReminder: true
          });
          await nextFrame();
          if (
            !automaticReminderSwitch.checked ||
            automaticReminderSwitch.disabled ||
            automaticRecoverySwitch.checked ||
            !recoverySwitch.checked ||
            recoverySettingsMenuSwitch.checked ||
            Math.abs(settingsViewport.scrollTop - reminderScrollBefore) > 1
          ) {
            throw new Error(
              "Automatic snapshot reminders could not be enabled independently without moving Settings"
            );
          }
          recoveryDisclosure.setAttribute("aria-expanded", "false");
          recoveryAdvanced.hidden = true;
          if (typeof hooks.reviewAutomaticSnapshotSettings !== "function") {
            throw new Error("Automatic snapshot settings review hook is unavailable");
          }
          hooks.reviewAutomaticSnapshotSettings(dialog);
          await nextFrame();
          await nextFrame();
          const automaticRecoveryRow = automaticRecoverySwitch.closest(
            ".rsl-feature-settings__row"
          );
          const settingsViewportRect = settingsViewport.getBoundingClientRect();
          const automaticRecoveryRowRect =
            automaticRecoveryRow.getBoundingClientRect();
          if (
            recoveryDisclosure.getAttribute("aria-expanded") !== "true" ||
            recoveryAdvanced.hidden ||
            document.activeElement !== automaticRecoverySwitch ||
            automaticRecoveryRowRect.top < settingsViewportRect.top - 1 ||
            automaticRecoveryRowRect.bottom > settingsViewportRect.bottom + 1
          ) {
            throw new Error(
              "The review action did not reveal, center, and focus Automatic snapshots"
            );
          }
          const automaticRecoveryRowTopBeforeEnable =
            automaticRecoveryRow.getBoundingClientRect().top;
          const automaticRecoveryScrollBeforeEnable = settingsViewport.scrollTop;
          await hooks.saveFeatureSettingsForTests({ recoverySnapshotArchive: true });
          if (
            !automaticRecoverySwitch.checked ||
            !automaticReminderSwitch.checked ||
            !recoverySwitch.checked ||
            recoverySettingsMenuSwitch.checked ||
            document.activeElement !== automaticRecoverySwitch ||
            Math.abs(
              settingsViewport.scrollTop - automaticRecoveryScrollBeforeEnable
            ) > 1 ||
            Math.abs(
              automaticRecoveryRow.getBoundingClientRect().top -
                automaticRecoveryRowTopBeforeEnable
            ) > 1
          ) {
            throw new Error(
              "Enabling automatic snapshots changed another Recovery switch or moved the focused setting"
            );
          }

          recoverySwitch
            ?.closest(".rsl-feature-settings__row")
            ?.scrollIntoView({ block: "center" });
          recoverySwitch?.focus({ preventScroll: true });
          await nextFrame();
          const masterScrollBefore = settingsViewport.scrollTop;
          await hooks.saveFeatureSettingsForTests({ recoverySnapshots: false });
          await nextFrame();
          if (
            recoverySwitch?.checked ||
            !recoverySettingsMenuSwitch.disabled ||
            !automaticRecoverySwitch.checked ||
            !automaticRecoverySwitch.disabled ||
            !automaticReminderSwitch.checked ||
            !automaticReminderSwitch.disabled ||
            recoveryOpen?.disabled ||
            recoveryViewAll?.disabled ||
            !recoveryFrequency?.disabled ||
            !recoveryRetention?.disabled ||
            !recoveryTradeHistory?.disabled ||
            !recoveryRecentlyPlayed?.disabled ||
            recoveryAdvanced?.hasAttribute("data-rsl-feature-parent-disabled") ||
            document.activeElement !== recoverySwitch ||
            Math.abs(settingsViewport.scrollTop - masterScrollBefore) > 1
          ) {
            throw new Error(
              "The Recovery Snapshots master switch did not gate automatic controls while leaving manual actions available without moving Settings"
            );
          }
          await hooks.saveFeatureSettingsForTests({ recoverySnapshots: true });
          if (
            !recoverySwitch?.checked ||
            recoverySettingsMenuSwitch.checked ||
            recoverySettingsMenuSwitch.disabled ||
            !automaticRecoverySwitch.checked ||
            automaticRecoverySwitch.disabled ||
            !automaticReminderSwitch.checked ||
            automaticReminderSwitch.disabled ||
            recoveryOpen?.disabled ||
            recoveryViewAll?.disabled ||
            recoveryFrequency?.disabled ||
            recoveryRetention?.disabled ||
            recoveryTradeHistory?.disabled ||
            recoveryRecentlyPlayed?.disabled ||
            recoveryAdvanced?.hasAttribute("data-rsl-feature-parent-disabled")
          ) {
            throw new Error("Recovery Snapshots did not restore its saved Advanced choices");
          }
          await hooks.saveFeatureSettingsForTests({
            recoverySnapshotMenu: true
          });
          if (
            !recoverySettingsMenuSwitch.checked ||
            recoverySettingsMenuSwitch.disabled ||
            !recoverySwitch.checked ||
            !automaticRecoverySwitch.checked
          ) {
            throw new Error("The Roblox Settings-menu shortcut did not re-enable cleanly");
          }

          await hooks.saveFeatureSettingsForTests({
            quickPlayActionPlay: false,
            quickPlayActionPrivate: true,
            quickPlayActionRandom: false
          });
          const privateOnlySaved = globalThis.__rslFixtureStorage.rslFeatureSettingsV1;
          if (
            privateOnlySaved.flags?.quickPlayActionPlay !== false ||
            privateOnlySaved.flags?.quickPlayActionPrivate !== true ||
            privateOnlySaved.flags?.quickPlayActionRandom !== false
          ) {
            throw new Error("Per-button Quick Play choices were not saved independently");
          }

          const homeHost = document.createElement("section");
          homeHost.className = "rsl-best-friends-carousel";
          homeHost.innerHTML = `
            <section data-rsl-quick-settings>Quick Settings stays visible</section>
            <div class="container-header"><h2>Best Friends</h2></div>
            <div class="friends-carousel-container">
              <div class="friends-carousel-list-container">Best Friends content</div>
            </div>
          `;
          document.body.append(homeHost);
          hooks.setBestFriendsHomeVisibility(homeHost, false);
          const hiddenHeader = homeHost.querySelector(".container-header");
          const hiddenBody = homeHost.querySelector(".friends-carousel-container");
          const visibleQuickSettings = homeHost.querySelector("[data-rsl-quick-settings]");
          if (
            getComputedStyle(hiddenHeader).display !== "none" ||
            getComputedStyle(hiddenBody).display !== "none" ||
            getComputedStyle(visibleQuickSettings).display === "none"
          ) {
            throw new Error("Disabling Best Friends did not hide only its Home content");
          }
          homeHost.remove();

          await Promise.resolve();
          const finalButtonRect = roToolButton.getBoundingClientRect();
          const finalHeaderLogoRect = headerLogo.getBoundingClientRect();
          const finalDialogLogoRect = dialogLogo.getBoundingClientRect();
          const finalHeaderCenterDelta = [
            finalHeaderLogoRect.left + finalHeaderLogoRect.width / 2 -
              (finalButtonRect.left + finalButtonRect.width / 2),
            finalHeaderLogoRect.top + finalHeaderLogoRect.height / 2 -
              (finalButtonRect.top + finalButtonRect.height / 2)
          ];
          if (finalHeaderCenterDelta.some((value) => Math.abs(value) > 0.1)) {
            throw new Error("The final header SVG box is not centered inside its button");
          }
          document.body.dataset.headerLogoRect = JSON.stringify({
            left: finalHeaderLogoRect.left,
            top: finalHeaderLogoRect.top,
            width: finalHeaderLogoRect.width,
            height: finalHeaderLogoRect.height
          });
          document.body.dataset.dialogLogoRect = JSON.stringify({
            left: finalDialogLogoRect.left,
            top: finalDialogLogoRect.top,
            width: finalDialogLogoRect.width,
            height: finalDialogLogoRect.height
          });

          document.body.dataset.testResult = "pass";
          document.body.dataset.testMessage = "Feature settings browser fixture passed";
          const fixtureView = new URL(location.href).searchParams.get("view");
          if (fixtureView === "sidebar") {
            dialog
              .querySelector('[data-rsl-feature-disclosure="sidebarShortcuts"]')
              ?.click();
          } else if (fixtureView === "recovery") {
            dialog.close();
            const recovery = hooks.createAccountRecoveryModalComponent("dark");
            recovery.frame.src = new URL(
              "../recovery-snapshot.html?theme=dark&view=home-modal",
              location.href
            ).href;
            recovery.loading.hidden = true;
            recovery.frame.hidden = false;
            document.body.append(recovery.host);
            recovery.dialog.showModal();
            recovery.title?.focus({ preventScroll: true });
          } else if (fixtureView === "recovery-settings") {
            await hooks.saveFeatureSettingsForTests({
              recoverySnapshotMenu: false
            });
            const recoveryDisclosure = dialog.querySelector(
              '[data-rsl-feature-disclosure="recoverySnapshots"]'
            );
            recoveryDisclosure?.click();
            recoveryDisclosure
              ?.closest(".rsl-feature-settings__item")
              ?.scrollIntoView({ block: "center" });
          }
          document.title = "PASS: RoTool feature settings fixture";
        } catch (error) {
          document.body.dataset.testResult = "fail";
          document.body.dataset.testMessage = error?.message || String(error);
          document.title = `FAIL: ${document.body.dataset.testMessage}`;
        }
      })();
    </script>
  </body>
</html>
