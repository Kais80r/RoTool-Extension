<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RoTool Quick Play visual fixture</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
      :root {
        color-scheme: dark;
        --color-action-emphasis-background: #335fff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px;
        color: #f7f7f8;
        background: #111216;
        font: 600 16px/1.25 Arial, sans-serif;
      }

      main {
        display: flex;
        flex-wrap: wrap;
        gap: 36px;
        align-items: flex-start;
      }

      .game-card-container {
        width: 151px;
      }

      .game-card-container.wide {
        width: 374px;
      }

      .game-card-link {
        display: block;
        color: inherit;
        text-decoration: none;
      }

      .game-card-thumb-container,
      .featured-game-icon-container,
      .large-game-tile-thumb-container {
        width: 151px;
        height: 151px;
        border-radius: 9px;
        background:
          radial-gradient(circle at 70% 28%, #faeb50 0 9%, transparent 10%),
          linear-gradient(140deg, #26daf5 0 48%, #50c275 49% 70%, #b87a46 71%);
      }

      .featured-game-icon-container,
      .large-game-tile-thumb-container {
        width: 374px;
        height: 210px;
        background:
          radial-gradient(circle at 66% 34%, #f08d39 0 16%, transparent 17%),
          linear-gradient(145deg, #f0c96a 0 44%, #c66335 45% 67%, #72422e 68%);
      }

      .game-card-name {
        margin-top: 8px;
      }

      .game-card-meta {
        margin-top: 6px;
        color: #babdc7;
        font-size: 13px;
        font-weight: 500;
      }

      /* Minimal local stand-in for Roblox's globally loaded native classes. */
      .btn-common-play-game-lg.btn-primary-md {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        appearance: none;
        color: #fff;
        background: var(--color-action-emphasis-background, #335fff);
        border: 0;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgb(0 0 0 / 36%);
      }

      .icon-common-play {
        width: 32px;
        height: 32px;
        color: #fff;
      }

      .icon-common-play::before {
        display: block;
        width: 24px;
        height: 24px;
        margin: 4px;
        background: currentColor;
        clip-path: polygon(18% 8%, 90% 50%, 18% 92%);
        content: "";
      }

      /* Keep every card open in the screenshot fixture. */
      [data-rsl-quick-play-host] > [data-rsl-quick-play-surface] {
        visibility: visible;
        opacity: 1;
      }

      [data-rsl-quick-play-host] > [data-rsl-quick-play-surface] .rsl-quick-play-tray {
        transform: translateY(0);
      }
    </style>
  </head>
